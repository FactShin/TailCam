name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # conftest.py sets this too; explicit here so nothing ever touches hardware.
  TAILCAM_SYNTHETIC: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - run: npm ci
        working-directory: web-ui
      - name: Audit dashboard dependencies
        run: npm audit
        working-directory: web-ui
      - run: npm run typecheck && npm run build
        working-directory: web-ui
      - name: Check committed dashboard matches source
        run: |
          git diff --exit-code -- src/tailcam/web/spa
          test -z "$(git ls-files --others --exclude-standard src/tailcam/web/spa)"
      - run: npx playwright install --with-deps chromium
        working-directory: web-ui
      - name: Check production routing and PWA cache behavior
        run: npm run test:e2e
        working-directory: web-ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dashboard-browser-traces
          path: web-ui/test-results/
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests .github/scripts
      - run: mypy src/tailcam

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The integration tests exercise the HomeKit (HAP-python) and MQTT extras.
      - run: pip install -e ".[dev,homekit,mqtt]"
      - run: pytest -q

  # Independent VMs prevent one stuck phase from hiding all remaining Windows
  # results. Every existing phase still runs; the stable required job below
  # succeeds only when every matrix entry succeeded.
  windows-phases:
    name: Windows / ${{ matrix.phase.label }}
    runs-on: windows-2022
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        phase:
          - id: platform
            label: platform and installer tests
            tests: >-
              tests/test_windows.py tests/test_installer_script.py tests/test_service_control.py tests/test_update.py tests/test_hostinfo.py tests/test_version.py tests/test_setup.py tests/test_release_workflow.py tests/test_native_install_readiness.py tests/test_service_readiness.py tests/test_pytest_watchdog.py
          - id: api
            label: API and node lifecycle tests
            tests: >-
              tests/test_api.py tests/test_storage.py tests/test_cluster.py tests/test_mcp.py tests/test_node_config.py tests/test_node_lifecycle.py tests/test_node_readiness.py tests/test_runtime_probe.py
          - id: storage_contracts
            label: storage contracts
            tests: >-
              tests/test_storage_contracts.py
          - id: artifact_transfers
            label: artifact transfers
            tests: >-
              tests/test_artifact_transfers.py
          - id: storage_http
            label: storage HTTP
            tests: >-
              tests/test_storage_http.py
          - id: storage_processes
            label: storage processes
            tests: >-
              tests/test_storage_processes.py
          - id: training_export_security
            label: training export security
            tests: >-
              tests/test_training_export_security.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run Windows phase with owned process deadline
        timeout-minutes: 6
        run: >-
          python .github/scripts/pytest_watchdog.py --timeout 300 --dump-after 60
          --log artifacts/windows-${{ matrix.phase.id }}.log -- -vv -s --durations=20
          ${{ matrix.phase.tests }}
      - name: Preserve Windows phase diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-pytest-${{ matrix.phase.id }}
          path: artifacts/windows-*.log
          if-no-files-found: ignore
          retention-days: 7

  test-windows:
    needs: windows-phases
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every Windows phase to succeed
        env:
          WINDOWS_PHASES_RESULT: ${{ needs.windows-phases.result }}
        run: test "$WINDOWS_PHASES_RESULT" = success

  container-hub:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and start hub without camera or elevated access
        run: docker compose -f docker-compose.hub.yml up -d --build
      - name: Verify hub roles, identity and restart preservation
        run: python .github/scripts/check_hub.py
      - name: Container logs
        if: always()
        run: docker compose -f docker-compose.hub.yml logs --no-color
      - name: Clean up test containers and volumes
        if: always()
        run: docker compose -f docker-compose.hub.yml down -v
